<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus: {{ task.title }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #000000;
            --text-main: #FFFFFF;
            --text-muted: #555555;
            --accent-red: #EA2845;
            --btn-bg: #1A1A1A;
            
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: var(--font-ui); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            -webkit-font-smoothing: antialiased;
        }
        
        .nav-bar { position: absolute; top: 40px; left: 40px; }
        .back-btn { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 500;
            transition: color 0.2s; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover { color: var(--text-main); }

        .focus-container { text-align: center; width: 100%; max-width: 600px; padding: 20px; }
        
        .task-label { 
            font-size: 0.85rem; 
            color: var(--accent-red); 
            font-weight: 600;
            text-transform: uppercase; 
            margin-bottom: 12px; 
            letter-spacing: 2px; 
        }
        
        .task-title { 
            font-size: 1.5rem; 
            font-weight: 500; 
            color: var(--text-main); 
            margin-bottom: 60px; 
        }

        /* Editable Timer */
        .timer-display { 
            font-family: var(--font-mono);
            font-size: 9rem; /* Massive font */
            font-weight: 700; 
            margin-bottom: 60px; 
            letter-spacing: -6px; 
            line-height: 1;
            transition: color 0.3s ease; 
        }
        
        .timer-active { color: var(--accent-red); }
        
        .time-segment { 
            outline: none; 
            cursor: text; 
            border-bottom: 4px solid transparent;
            transition: border-color 0.2s; 
        }
        .time-segment:focus { border-bottom-color: var(--text-muted); }
        .time-segment.locked { cursor: default; border-bottom-color: transparent !important; pointer-events: none; }

        .controls { display: flex; justify-content: center; gap: 16px; }
        .control-btn { 
            background: var(--btn-bg); 
            border: none; 
            color: var(--text-main); 
            font-family: var(--font-ui); 
            font-size: 1rem; 
            font-weight: 600; 
            padding: 16px 40px; 
            cursor: pointer; 
            border-radius: 999px; /* Pill button */
            transition: transform 0.1s, background 0.2s; 
        }
        .control-btn:active { transform: scale(0.96); }
        
        .control-btn.primary { 
            background-color: var(--text-main); 
            color: var(--bg-color); 
        }
        .control-btn.primary:hover { background-color: #E5E5E5; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="{% url 'homepage' %}" class="back-btn">← Back</a>
    </div>

    <div class="focus-container">
        <div class="task-label">Focusing On</div>
        <div class="task-title">{{ task.title }}</div>

        <div class="timer-display" id="timer-display">
            <span id="minutes" class="time-segment" contenteditable="true">25</span>:<span id="seconds" class="time-segment" contenteditable="true">00</span>
        </div>

        <div class="controls">
            <button class="control-btn primary" id="start-btn">Start</button>
            <button class="control-btn primary" id="pause-btn" style="display:none;">Pause</button>
            <button class="control-btn" id="reset-btn">Reset</button>
        </div>
    </div>

    <script>
        let timerInterval;
        let isRunning = false;

        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const displayEl = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');

        function sanitizeInput(el, max) {
            let val = parseInt(el.innerText) || 0;
            if (val > max) val = max;
            if (val < 0) val = 0;
            el.innerText = String(val).padStart(2, '0');
        }

        minutesEl.addEventListener('blur', () => sanitizeInput(minutesEl, 99));
        secondsEl.addEventListener('blur', () => sanitizeInput(secondsEl, 59));
        
        [minutesEl, secondsEl].forEach(el => {
            el.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
                if (!/[0-9]/.test(e.key)) e.preventDefault();
            });
        });

        function toggleLock(locked) {
            if (locked) {
                minutesEl.classList.add('locked');
                secondsEl.classList.add('locked');
                minutesEl.contentEditable = "false";
                secondsEl.contentEditable = "false";
            } else {
                minutesEl.classList.remove('locked');
                secondsEl.classList.remove('locked');
                minutesEl.contentEditable = "true";
                secondsEl.contentEditable = "true";
            }
        }

        function updateTimer() {
            let m = parseInt(minutesEl.innerText) || 0;
            let s = parseInt(secondsEl.innerText) || 0;

            if (m === 0 && s === 0) {
                clearInterval(timerInterval);
                isRunning = false;
                displayEl.classList.remove('timer-active');
                toggleLock(false);
                startBtn.style.display = 'block';
                pauseBtn.style.display = 'none';
                return;
            }

            if (s === 0) { m--; s = 59; } 
            else { s--; }

            minutesEl.innerText = String(m).padStart(2, '0');
            secondsEl.innerText = String(s).padStart(2, '0');
        }

        startBtn.addEventListener('click', () => {
            if (isRunning) return;
            minutesEl.blur(); secondsEl.blur(); 
            
            if (parseInt(minutesEl.innerText) === 0 && parseInt(secondsEl.innerText) === 0) return;

            isRunning = true;
            toggleLock(true);
            displayEl.classList.add('timer-active');
            
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'block';

            timerInterval = setInterval(updateTimer, 1000);
        });

        pauseBtn.addEventListener('click', () => {
            isRunning = false;
            clearInterval(timerInterval);
            displayEl.classList.remove('timer-active');
            toggleLock(false);
            
            startBtn.style.display = 'block';
            pauseBtn.style.display = 'none';
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false;
            clearInterval(timerInterval);
            displayEl.classList.remove('timer-active');
            toggleLock(false);
            
            minutesEl.innerText = '25';
            secondsEl.innerText = '00';
            
            startBtn.style.display = 'block';
            pauseBtn.style.display = 'none';
        });
    </script>
</body>
</html>
